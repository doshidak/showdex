name: build-firefox

# spits out the three things an AMO submission actually needs: the .xpi, the source archive that
# matches it, & the SHA256SUMS.txt a reviewer checks both against. background in AMO-REVIEW.md.

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # kept apart from the build job on purpose. a broken unit test is worth knowing about, but it
  # shouldn't be the reason a release artifact never gets built & hashed
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  build:
    runs-on: ubuntu-latest

    # only the tagged-release upload at the bottom needs write
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # one BUILD_DATE for the entire run so the .xpi & the .source.zip carry the same id. v1.4.2
      # went out as b1A09EE25A87 for Firefox & b1A09EE1E7F0 for Chrome, two different clocks, which
      # tells you nothing about which source built which file
      - name: Pin BUILD_DATE
        run: |
          echo "BUILD_DATE=$(node -e 'process.stdout.write(Date.now().toString(16).toUpperCase())')" >> "$GITHUB_ENV"

      # the submission lives or dies on this, so it runs before anything gets published
      - name: Verify reproducibility
        run: pnpm verify:reproducible

      - name: Build extension
        run: pnpm build:firefox:fast

      - name: Package source
        run: pnpm package:source

      - name: Hash artifacts
        working-directory: dist
        run: sha256sum ./*.firefox.xpi ./*.source.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: showdex-firefox
          if-no-files-found: error
          path: |
            dist/*.firefox.xpi
            dist/*.source.zip
            dist/*.source.txt
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.firefox.xpi
            dist/*.source.zip
            dist/*.source.txt
            dist/SHA256SUMS.txt
